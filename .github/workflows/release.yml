name: Release

on:
  push:
    tags: ["v*"]

# No long-lived npm token: id-token lets the runner exchange a short-lived OIDC
# credential with npm via trusted publishing. Everything else stays read-only.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gated on a protected environment, so a tag push waits for an approval
    # from a required reviewer before anything reaches the registry.
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires a recent npm; the bundled one may predate it.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Releasing $pkg"

      - name: Check syntax and run tests
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
